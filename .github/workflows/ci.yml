name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/foundation-v2, feat/magnetic-growth-v2, feat/visual-growth-v2, feat/autonomous-bots-v2, feat/world-infrastructure-v2, feat/giant-growth-v2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
